<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ekklésia - CRM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,sans-serif}
body{background:#0a0a0a;color:#fff;display:flex}
.sidebar{position:fixed;left:0;top:0;width:280px;height:100vh;background:#111;border-right:1px solid #222;z-index:9999;transform:translateX(-100%);transition:0.3s;padding:20px;display:flex;flex-direction:column}
.sidebar.open{transform:translateX(0)}
.sidebar h1{font-size:28px;margin-bottom:20px}
.sidebar input{width:100%;padding:12px;border-radius:12px;border:1px solid #222;background:#1a1a1a;color:#fff;margin-bottom:10px}
.sidebar a{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;color:#aaa;text-decoration:none;margin-bottom:4px}
.sidebar a.active,.sidebar a:hover{background:#fff;color:#000}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9998}
.overlay.show{display:block}
.main-content{flex:1;min-height:100vh;padding:20px;width:100%;transition:0.3s}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.menu-toggle{font-size:28px;background:none;border:none;color:#fff;cursor:pointer}
@media(min-width:768px){.sidebar{transform:translateX(0)}.main-content{margin-left:280px}.menu-toggle{display:none}.overlay{display:none!important}}
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="fecharMenu()"></div>

<div class="sidebar" id="sidebar">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h1>Ekklésia</h1>
    <span>☀️</span>
  </div>
  <input placeholder="🔍 Buscar...">
  <a href="#" class="active">📁 CRM Kanban</a>
  <a href="#">🎯 Prospecção</a>
  <a href="#">👥 Clientes</a>
  <a href="#">🧠 Treinamento IA</a>
  <a href="#">⚡ Automações</a>
  <a href="#">📊 Monitoramento</a>
  <div style="margin-top:auto;color:#666;font-size:12px">ILIMITADO <span style="color:#0f0">• 999 Zaps • 999 Usuários</span></div>
  <div style="margin-top:20px;border:1px solid #333;border-radius:30px;padding:10px;text-align:center">1 • R$0</div>
</div>

<div class="main-content">
  <div class="topbar">
    <button class="menu-toggle" onclick="abrirMenu()">☰</button>
    <div id="conteudo-kanban">Seu Kanban aqui...</div>
  </div>
  <!-- COLE SEU KANBAN AQUI DENTRO -->
</div>

<script>
function abrirMenu(){document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show')}
function fecharMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show')}
document.querySelectorAll('.sidebar a').forEach(a=>a.addEventListener('click',()=>{if(window.innerWidth<768)fecharMenu()}));
</script>
</body>
</html>
