<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM EKKLESIA v3.2 LUXO DARK</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Arial,sans-serif}
body{background:#0f0f14;color:#fff;padding:18px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.header h1{color:#facc15;font-size:20px;letter-spacing:1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.card-stat{background:#1e1e2a;padding:14px;border-radius:12px;border:1px solid #2a2a3a}
.card-stat b{font-size:11px;color:#999;display:block;margin-bottom:4px}
.card-stat span{font-size:24px;font-weight:800}
.form{display:flex;gap:8px;margin-bottom:16px}
.form input{flex:1;padding:12px;border-radius:10px;border:1px solid #333;background:#1e1e2a;color:#fff;outline:none}
.form button{padding:12px 18px;border-radius:10px;border:0;background:#facc15;color:#000;font-weight:900;cursor:pointer}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.col{background:#15151f;border-radius:14px;padding:10px;min-height:450px;border:1px solid #2a2a3a}
.col h3{color:#facc15;font-size:12px;margin-bottom:10px;text-align:center;letter-spacing:1px}
.lead{background:#252536;padding:10px;border-radius:10px;margin-bottom:8px;border-left:4px solid #facc15}
.lead b{font-size:13px}
.lead small{display:block;color:#aaa;font-size:11px;margin:3px 0 6px}
.btns{display:flex;gap:6px}
.btns button{font-size:10px;padding:6px 8px;border-radius:6px;border:0;cursor:pointer;font-weight:700}
.btn-zap{background:#25D366;color:#fff}
.btn-mover{background:#facc15;color:#000}
</style>
</head>
<body>
<div class="header">
<h1>CRM EKKLESIA v3.2 LUXO</h1>
<div style="font-size:11px;color:#00ff88">● ONLINE • IA ON • NEON</div>
</div>

<div class="stats">
<div class="card-stat"><b>TOTAL LEADS</b><span id="total">0</span></div>
<div class="card-stat"><b>WHATSAPP</b><span id="whats">0</span></div>
<div class="card-stat"><b>SCORE IA MÉDIO</b><span id="media">0%</span></div>
<div class="card-stat"><b>GARGALO</b><span id="gargalo">0</span></div>
</div>

<div class="form">
<input id="nome" placeholder="Nome do lead">
<input id="zap" placeholder="WhatsApp só números ex: 27999999999">
<button onclick="criar()">+ Novo Lead IA</button>
</div>

<div class="kanban">
<div class="col" id="novo"><h3>NOVO</h3></div>
<div class="col" id="qualificado"><h3>QUALIFICADO</h3></div>
<div class="col" id="proposta"><h3>PROPOSTA</h3></div>
<div class="col" id="fechado"><h3>FECHADO</h3></div>
</div>

<script>
const API = '/api';
async function load(){
 try{
  const leads = await fetch(API+'/leads').then(r=>r.json());
  const stats = await fetch(API+'/stats').then(r=>r.json());
  document.getElementById('total').innerText = stats.total || 0;
  document.getElementById('whats').innerText = stats.whatsapp || 0;
  document.getElementById('media').innerText = (stats.media||0)+'%';
  document.getElementById('gargalo').innerText = (stats.gargalo||0)+' em Prop';
  ['novo','qualificado','proposta','fechado'].forEach(s=> document.getElementById(s).innerHTML=`<h3>${s.toUpperCase()}</h3>`);
  leads.forEach(l=>{
   const d=document.createElement('div'); d.className='lead';
   d.innerHTML=`<b>${l.nome}</b><small>${l.whatsapp} • Score ${l.score_ia}%</small>
   <div class="btns">
   <button class="btn-zap" onclick="window.open('https://wa.me/55${l.whatsapp}','_blank')">WhatsApp</button>
   <button class="btn-mover" onclick="mover(${l.id},'${next(l.status)}')">→ ${next(l.status).toUpperCase()}</button>
   </div>`;
   (document.getElementById(l.status)||document.getElementById('novo')).appendChild(d);
  });
 }catch(e){ console.log(e); }
}
function next(s){ if(s=='novo')return 'qualificado'; if(s=='qualificado')return 'proposta'; if(s=='proposta')return 'fechado'; return 'fechado'; }
async function criar(){
 const nome=document.getElementById('nome').value.trim();
 const whatsapp=document.getElementById('zap').value.trim();
 if(!nome||!whatsapp)return alert('Preencha nome e zap');
 const r=await fetch(API+'/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,whatsapp})});
 if(r.ok){document.getElementById('nome').value='';document.getElementById('zap').value='';load();} else alert('Erro ao criar');
}
async function mover(id,status){
 await fetch(API+'/leads/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});
 load();
}
load();
</script>
</body>
</html>
