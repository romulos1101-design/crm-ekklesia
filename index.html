<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM Ekklesia v3.4 PRO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,system-ui}
body{background:#0a0a0a;color:#fff;padding:15px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px}
.top h1 span{color:#ffcc00}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:#1a1a1a;border:1px solid #333;padding:10px 15px;border-radius:10px;min-width:100px}
.stat b{font-size:20px;color:#ffcc00;display:block}
.bar{display:flex;gap:8px;margin-bottom:15px;flex-wrap:wrap}
.bar input, .bar button{padding:12px;border-radius:8px;border:none}
.bar input{background:#1a1a1a;color:#fff;border:1px solid #333;flex:1;min-width:150px}
.bar button{background:#ffcc00;color:#000;font-weight:800;cursor:pointer}
.bar .ghost{background:#222;color:#fff;border:1px solid #444}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.col{background:#111;border:1px solid #222;border-radius:12px;padding:10px;min-height:400px}
.col h3{margin-bottom:10px;font-size:14px}
.card{background:#1e1e1e;border:1px solid #333;border-radius:10px;padding:10px;margin-bottom:8px}
.card .score{float:right;background:#ffcc00;color:#000;font-weight:800;padding:2px 6px;border-radius:6px;font-size:12px}
.card .zap{font-size:12px;color:#888}
.card .obs{font-size:11px;color:#bbb;margin-top:6px;background:#151515;padding:4px;border-radius:4px;white-space:pre-wrap}
.card .actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.card .actions button{font-size:11px;padding:5px 7px;border-radius:6px;border:none;cursor:pointer}
.btn-mov{background:#333;color:#fff}.btn-del{background:#ff2d2d;color:#fff}.btn-zap{background:#25d366;color:#000;font-weight:700}.btn-edit{background:#ffcc00;color:#000}
.search{width:100%;margin-bottom:12px;padding:12px;border-radius:8px;border:1px solid #333;background:#1a1a1a;color:#fff}
@media(max-width:900px){.kanban{grid-template-columns:1fr 1fr} }@media(max-width:600px){.kanban{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="top">
<h1>CRM <span>EKKLESIA</span> v3.4 PRO</h1>
<div class="stats">
<div class="stat"><b id="t-total">0</b>TOTAL</div>
<div class="stat"><b id="t-whats">0</b>WHATSAPP</div>
<div class="stat"><b id="t-fechado">0</b>FECHADOS</div>
<div class="stat"><b id="t-valor">R$ 0</b>VALOR</div>
</div>
</div>
<input id="busca" class="search" placeholder="🔍 Buscar lead por nome ou whatsapp...">
<div class="bar">
<input id="nome" placeholder="Nome / Igreja">
<input id="whatsapp" placeholder="WhatsApp (só números)">
<input id="observacao" placeholder="Obs / Valor ex: Cliente quer 3 cultos - R$1500">
<button onclick="criarLead()">+ Lead IA</button>
<button class="ghost" onclick="exportCSV()">📥 Exportar CSV</button>
</div>
<div class="kanban">
<div class="col" data-status="novo"><h3>📋 NOVO</h3><div id="col-novo"></div></div>
<div class="col" data-status="qualificado"><h3>⭐ QUALIFICADO</h3><div id="col-qualificado"></div></div>
<div class="col" data-status="proposta"><h3>💰 PROPOSTA</h3><div id="col-proposta"></div></div>
<div class="col" data-status="fechado"><h3>✅ FECHADO</h3><div id="col-fechado"></div></div>
</div>
<script>
let leads=[];
async function carregar(){ const r=await fetch('/api/leads'); leads=await r.json(); render(); }
function render(){
  const busca=document.getElementById('busca').value.toLowerCase();
  let filtrados=leads.filter(l=>(l.nome+l.whatsapp).toLowerCase().includes(busca));
  ['novo','qualificado','proposta','fechado'].forEach(st=>{document.getElementById('col-'+st).innerHTML='';});
  let totalValor=0;
  filtrados.forEach(l=>{
    totalValor+=Number(l.valor||0);
    const col=document.getElementById('col-'+(l.status||'novo')); if(!col) return;
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<span class="score">${l.score_ia||65}%</span><b>${l.nome}</b><br><span class="zap">${l.whatsapp} ${l.valor>0?'• R$ '+l.valor:''}</span>${l.observacao?`<div class="obs">${l.observacao}</div>`:''}<div class="actions">${l.status!='novo'?`<button class="btn-mov" onclick="mover(${l.id},'novo')">Novo</button>`:''}${l.status!='qualificado'?`<button class="btn-mov" onclick="mover(${l.id},'qualificado')">Quali</button>`:''}${l.status!='proposta'?`<button class="btn-mov" onclick="mover(${l.id},'proposta')">Proposta</button>`:''}${l.status!='fechado'?`<button class="btn-mov" onclick="mover(${l.id},'fechado')">Fechado</button>`:''}<button class="btn-zap" onclick="abrirZap('${l.whatsapp}')">Zap</button><button class="btn-edit" onclick="editarLead(${l.id})">Editar</button><button class="btn-del" onclick="deletar(${l.id})">X</button></div>`;
    col.appendChild(div);
  });
  document.getElementById('t-total').innerText=filtrados.length;
  document.getElementById('t-whats').innerText=filtrados.length;
  document.getElementById('t-fechado').innerText=filtrados.filter(l=>l.status=='fechado').length;
  document.getElementById('t-valor').innerText='R$ '+totalValor;
}
async function criarLead(){
  const nome=document.getElementById('nome').value.trim();
  let whatsapp=document.getElementById('whatsapp').value.trim().replace(/\D/g,'');
  const obsInput=document.getElementById('observacao').value.trim();
  if(!nome||!whatsapp){alert('Preencha nome e whatsapp');return;}
  let valor=0; const m=obsInput.match(/(\d+[.,]?\d*)/); if(obsInput.toLowerCase().includes('r$')&&m){valor=parseFloat(m[1].replace(',','.'))||0;}
  const res=await fetch('/api/leads',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({nome,whatsapp,observacao:obsInput,valor})});
  if(!res.ok){const e=await res.json();alert('Erro: '+e.error);return;}
  document.getElementById('nome').value='';document.getElementById('whatsapp').value='';document.getElementById('observacao').value='';
  carregar();
}
async function mover(id,status){await fetch('/api/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});carregar();}
async function deletar(id){if(!confirm('Apagar lead?'))return;await fetch('/api/leads/'+id,{method:'DELETE'});carregar();}
function abrirZap(wpp){window.open('https://wa.me/55'+wpp,'_blank');}
async function editarLead(id){const l=leads.find(x=>x.id==id);const novaObs=prompt('Observação:',l.observacao||'');if(novaObs===null)return;const novoValor=prompt('Valor da venda:',l.valor||0);if(novoValor===null)return;await fetch('/api/leads/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({observacao:novaObs,valor:parseFloat(novoValor)||0})});carregar();}
function exportCSV(){let csv='nome,whatsapp,status,score,valor,observacao\n';leads.forEach(l=>{csv+=`"${l.nome}","${l.whatsapp}","${l.status}",${l.score_ia},${l.valor||0},"${(l.observacao||'').replace(/"/g,'""')}"\n`;});const blob=new Blob([csv],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='leads-ekklesia.csv';a.click();}
document.getElementById('busca').addEventListener('input',render);carregar();
</script>
</body>
</html>
